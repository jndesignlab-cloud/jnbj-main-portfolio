<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Project case study by Jann Jaravata." />
  <title>Project — Jann Jaravata</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="project-page">
  <header class="project-topbar">
    <div class="shell project-topbar-inner">
      <a href="index.html#work-finder" class="back-link">← Back to portfolio</a>
      <a href="index.html" class="project-brand"><span>JJ</span><strong>Jann Jaravata</strong></a>
      <a href="https://bit.ly/JNBJ-Resume" target="_blank" rel="noreferrer">Résumé ↗</a>
    </div>
  </header>

  <main id="projectRoot" class="project-case-shell">
    <section class="project-hero-case shell">
      <div class="project-breadcrumb" id="projectSkill">SELECTED PROJECT</div>
      <h1 id="projectTitle">Loading project…</h1>
      <p id="projectSummary"></p>
      <div class="project-meta-row" id="projectMeta"></div>
    </section>

    <section class="project-image-stage shell">
      <img id="projectImage" src="" alt="" />
    </section>

    <section class="case-content shell">
      <aside class="case-sidebar">
        <div><small>ROLE</small><strong id="projectRole"></strong></div>
        <div><small>TOOLS</small><div class="case-tools" id="projectTools"></div></div>
        <a href="index.html#work-finder">Explore more work ↗</a>
      </aside>

      <div class="case-main">
        <article>
          <span>01</span>
          <div><h2>The Problem / Goal</h2><p id="projectProblem"></p></div>
        </article>
        <article>
          <span>02</span>
          <div><h2>What I Did</h2><p id="projectContribution"></p></div>
        </article>
        <article>
          <span>03</span>
          <div><h2>Result / Outcome</h2><p id="projectOutcome"></p></div>
        </article>
      </div>
    </section>

    <section class="next-project shell">
      <span>NEXT PROJECT</span>
      <a id="nextProjectLink" href="#"><strong id="nextProjectTitle"></strong><b>→</b></a>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <div><strong>Jann Jaravata</strong><span>Multidisciplinary Graphic Designer</span></div>
      <div><span>© 2026 Jann Nathaniel Jaravata</span><span>Personal portfolio project page</span></div>
    </div>
  </footer>

  <script src="project-data.js"></script>
  <script src="project.js"></script>
</body>
</html>
