<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Project gallery by Jann Jaravata." />
  <title>Project — Jann Jaravata</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="v1-8.css" />
  <link rel="stylesheet" href="v1-9.css" />

<body class="project-gallery-page">
  <header class="project-topbar">
    <div class="shell project-topbar-inner">
      <a href="projects.html" class="back-link">← Back to projects</a>
      <a href="index.html" class="project-brand"><span>JJ</span><strong>Jann Jaravata</strong></a>
      <a href="cv.html">Online CV ↗</a>
    </div>
  </header>

  <main id="projectRoot">
    <section class="project-gallery-hero shell">
      <div class="project-breadcrumb" id="projectSkill">SELECTED PROJECT</div>
      <h1 id="projectTitle">Loading project…</h1>
      <p id="projectSummary"></p>
    </section>

    <section class="project-gallery-stage shell">
      <div class="project-main-preview" id="projectMainPreview"><div class="project-gallery-empty">Loading project images…</div></div>
      <div class="project-gallery-heading">
        <div><span class="section-kicker">PROJECT IMAGES</span><h2>Browse the gallery</h2></div>
        <span id="projectImageCount"></span>
      </div>
      <div class="project-gallery-thumbs" id="projectGalleryThumbs"></div>
    </section>
  </main>

  <aside class="visitor-float" aria-label="Portfolio visit count"><span class="visitor-float-dot"></span><span class="visitor-float-label">Portfolio visits</span><strong id="visitorCount">—</strong></aside>
  <footer class="site-footer"><div class="shell footer-inner"><div><strong>Jann Jaravata</strong><span>Project gallery</span></div><div><span>© 2026 Jann Nathaniel Jaravata</span><span>Shared DesignLab project archive</span></div></div></footer>

  <script src="config.js"></script>
  <script src="project-data.js"></script>
  <script src="project-archive.js"></script>
  <script src="visitor.js"></script>
  <script src="project.js"></script>
  <script src="motion.js"></script>
</body>
</html>
